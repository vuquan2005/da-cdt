/**:
  ros__parameters:
    use_sim_time: true

    # Dual Array Configuration
    enable_rear_array: true        # true: Enable both Front and Rear arrays (Dual Array)

    # Front Sensor Array (Đầu xe)
    num_sensors_front: 8           # Number of IR sensors at front
    sensor_spacing_front: 0.018    # Distance between adjacent sensors (18mm)
    offset_x_front: 0.18           # Forward distance from base_link (+180mm)
    offset_y_front: 0.0            # Lateral offset (0.0 = centered)

    # Rear Sensor Array (Đuôi xe)
    num_sensors_rear: 8            # Number of IR sensors at rear
    sensor_spacing_rear: 0.018     # Distance between adjacent sensors (18mm)
    offset_x_rear: -0.18           # Backward distance from base_link (-180mm)
    offset_y_rear: 0.0             # Lateral offset (0.0 = centered)

    # Line Detection Properties
    line_color_white: false        # false: dark/black line on light ground (Robocon Arena)
    threshold: 90                  # Grayscale threshold for binary line detection (0-255)
    noise_probability: 0.0         # Simulated sensor noise / glitch rate (0.0 to 0.05)
    update_rate: 50.0              # Sampling frequency (Hz)

    # Arena Coordinate Mapping (Meters)
    arena_size_x: 4.0              # Total arena size along X
    arena_size_y: 2.0              # Total arena size along Y
    arena_origin_x: 0.0            # Center X coordinate in world frame
    arena_origin_y: 0.0            # Center Y coordinate in world frame

    # Frames
    base_frame: "base_link"
    world_frame: "odom"
