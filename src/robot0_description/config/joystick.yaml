joy_node:
  ros__parameters:
    # SDL device name; stable even when Linux /dev/input/jsN changes (e.g. keyd).
    device_id: 0
    device_name: "PowerA Xbox Series X Controller"
    deadzone: 0.05
    autorepeat_rate: 20.0

teleop_twist_joy_node:
  ros__parameters:
    holonomic: true
    require_enable_button: true
    enable_button: 4        # LB / L1 để kích hoạt di chuyển
    enable_turbo_button: 5  # RB / R1 để tăng tốc độ (Turbo)

    axis_linear:
      x: 1                  # Cần trái (Lên/Xuống) -> Tiến / Lùi
      y: 0                  # Cần trái (Trái/Phải) -> Đi ngang
    scale_linear:
      x: 0.5
      y: 0.5
    scale_linear_turbo:
      x: 1.0
      y: 1.0

    axis_angular:
      yaw: 3                # Cần phải (Trái/Phải) -> Xoay góc
    scale_angular:
      yaw: 1.0
    scale_angular_turbo:
      yaw: 2.0
